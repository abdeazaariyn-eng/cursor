proxy_cache_path /var/cache/nginx/mahdbaby levels=1:2 keys_zone=store_cache:32m inactive=24h max_size=1g;

limit_req_zone $binary_remote_addr zone=store_pages:10m rate=80r/s;
limit_req_zone $binary_remote_addr zone=store_api:10m rate=20r/s;

upstream frontend_upstream {
    server frontend:3000;
    keepalive 64;
}

upstream backend_upstream {
    server backend:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location ^~ /api/ {
        limit_req zone=store_api burst=60 nodelay;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://backend_upstream;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header X-Proxy-Cache BYPASS always;
    }

    location ^~ /admin {
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://frontend_upstream;
    }

    location ^~ /_next/static/ {
        proxy_cache store_cache;
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Set-Cookie;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Proxy-Cache $upstream_cache_status always;
        proxy_pass http://frontend_upstream;
    }

    location ^~ /_next/image {
        proxy_cache store_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie;
        add_header X-Proxy-Cache $upstream_cache_status always;
        proxy_pass http://frontend_upstream;
    }

    location ^~ /images/ {
        proxy_cache store_cache;
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Set-Cookie;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Proxy-Cache $upstream_cache_status always;
        proxy_pass http://frontend_upstream;
    }

    location / {
        limit_req zone=store_pages burst=240 nodelay;
        proxy_cache store_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10s;
        proxy_cache_valid 301 302 1m;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie;
        add_header X-Proxy-Cache $upstream_cache_status always;
        proxy_pass http://frontend_upstream;
    }
}